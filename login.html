<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="random-number-clip">
        <div class="random-number" id="randomNumberone">0000</div>
    </div>
    <div class="table-glow"></div>

    <div class="auth-shell">

        <div class="auth-brand">
            <div class="brand-mark"></div>
            <div class="brand-name">Planora</div>
            <div class="brand-tag">Never miss a moment.</div>
        </div>

        <div class="auth-card">

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Sign in</button>
                <button class="auth-tab" data-tab="signup">Create account</button>
            </div>

            <!-- ================= LOGIN ================= -->
            <form class="auth-form active" id="loginForm" autocomplete="off" novalidate>

                <label class="field-label" for="loginUsername">Username</label>
                <input class="field-input" id="loginUsername" name="username" type="text" placeholder="e.g. sable" autocomplete="username" required>

                <label class="field-label" for="loginPassword">Password</label>
                <div class="password-wrap">
                    <input class="field-input" id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button type="button" class="reveal-toggle" data-target="loginPassword">Show</button>
                </div>

                <label class="remember-row">
                    <input type="checkbox" id="rememberMe" checked>
                    <span>Keep me signed in on this device</span>
                </label>

                <div class="form-error" id="loginError"></div>

                <button type="submit" class="btn btn-solid auth-submit" id="loginSubmit">Sign in</button>

            </form>

            <!-- ================= SIGN UP ================= -->
            <form class="auth-form" id="signupForm" autocomplete="off" novalidate>

                <label class="field-label" for="signupDisplayName">Display name</label>
                <input class="field-input" id="signupDisplayName" name="displayName" type="text" placeholder="What should people see?" maxlength="40">

                <label class="field-label" for="signupUsername">Username</label>
                <input class="field-input" id="signupUsername" name="username" type="text" placeholder="Letters, numbers, . and _" autocomplete="username" required>

                <label class="field-label" for="signupPassword">Password</label>
                <div class="password-wrap">
                    <input class="field-input" id="signupPassword" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" required>
                    <button type="button" class="reveal-toggle" data-target="signupPassword">Show</button>
                </div>
                <div class="strength-hint" id="strengthHint">Mix letters and numbers, 8+ characters.</div>

                <div class="form-error" id="signupError"></div>

                <button type="submit" class="btn btn-solid auth-submit" id="signupSubmit">Create account</button>

            </form>

            <p class="auth-footnote">
                Accounts and stuff are saved in a list, there's no actual database yet.
            </p>

        </div>

    </div>

    <div class="toast-stack" id="toastStack"></div>

    <script src="api.js"></script>
    <script src="login.js"></script>
    <script src="numchange.js"></script>

</body>
</html>
