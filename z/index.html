<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Horedinn</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="backgroundignore"></div>

    <main class="onboarding">

        <div class="pages" id="pages">

            <section class="page">
                <div class="title pageone-title">Planora</div>
                <div class="description">Never Miss a Moment.</div>
                <div class="cards-container">
                    <div class="ace"></div>
                    <div class="card c-one">NEVER</div>
                    <div class="card c-two">MISS</div>
                    <div class="card c-three">MOMENT</div>
                </div>
            </section>
            <section class="page"></section>

        </div>


        <div class="bottom">

            <div class="dots">

                <span class="dot active"></span>
                <span class="dot"></span>

            </div>

            <button id="nextButton">
                NEXT →
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
