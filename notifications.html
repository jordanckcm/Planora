<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Notifications · Planora</title>
<script>
    // force dark, and undo anything that tries to change it later
    (function () {
        const root = document.documentElement;
        const force = () => { if (root.getAttribute("data-theme") !== "dark") root.setAttribute("data-theme", "dark"); };
        force();
        new MutationObserver(force).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    })();
</script>
<style>
    :root, :root[data-theme="light"], :root[data-theme="dark"] {
        color-scheme: dark;
        --nt-bg:#131313; --nt-card:#1b1b1b; --nt-text:#f2f2f2;
        --nt-dim:rgba(255,255,255,.6); --nt-line:rgba(255,255,255,.1); --nt-accent:#c9a227;
    }
    html, body { background:var(--nt-bg) !important; color:var(--nt-text); }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .nt-wrap { max-width:680px; margin:0 auto; padding:24px 16px 64px; }
    .nt-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .nt-top h1 { margin:0; font-size:24px; }
    .nt-actions button, .nt-tabs button { font:inherit; font-size:13px; cursor:pointer; color:var(--nt-text); background:transparent; border:1px solid var(--nt-line); border-radius:999px; padding:6px 12px; }
    .nt-tabs { display:flex; gap:8px; margin-bottom:14px; }
    .nt-tabs button.on { background:var(--nt-accent); border-color:var(--nt-accent); color:#111; font-weight:600; }
    .nt-actions { display:flex; gap:8px; }
    .nt-row { display:flex; gap:12px; align-items:flex-start; padding:12px; margin-bottom:8px; background:var(--nt-card); border:1px solid var(--nt-line); border-radius:14px; cursor:pointer; position:relative; }
    .nt-row:hover { border-color:var(--nt-accent); }
    .nt-row.unread { border-left:3px solid var(--nt-accent); }
    .nt-avatar { width:40px; height:40px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
    .nt-body { flex:1; min-width:0; }
    .nt-line { font-size:14px; line-height:1.4; }
    .nt-snippet { margin-top:4px; font-size:13px; color:var(--nt-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .nt-time { font-size:12px; color:var(--nt-dim); margin-top:4px; }
    .nt-x { background:none; border:0; color:var(--nt-dim); font-size:18px; cursor:pointer; line-height:1; padding:2px 6px; }
    .nt-x:hover { color:var(--nt-text); }
    .nt-empty, .nt-error { text-align:center; color:var(--nt-dim); padding:48px 0; }
    [hidden] { display:none !important; }
</style>
</head>
<body>
<main class="nt-wrap">
    <div class="nt-top">
        <h1>Notifications</h1>
        <div class="nt-actions">
            <button type="button" id="ntMarkAll">Mark all read</button>
            <button type="button" id="ntClear">Clear all</button>
        </div>
    </div>
    <div class="nt-tabs" id="ntTabs">
        <button type="button" data-filter="all" class="on">All</button>
        <button type="button" data-filter="unread">Unread</button>
        <button type="button" data-filter="mention">Mentions</button>
    </div>
    <div id="ntList"></div>
    <p class="nt-empty" id="ntEmpty" hidden></p>
    <p class="nt-error" id="ntError" hidden></p>
</main>

<script src="api.js"></script>
<script src="planora-nav.js"></script>
<script src="notifications.js"></script>
</body>
</html>
