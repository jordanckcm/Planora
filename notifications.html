<!DOCTYPE html>
<html lang="en" data-theme="dark" style="background:#131313;color-scheme:dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Notifications · Planora</title>
<style>
    html, body { margin:0; background:#131313 !important; color:#f2f2f2 !important; color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    .nt-wrap { max-width:680px; margin:0 auto; padding:24px 16px 64px; }
    .nt-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
    .nt-top h1 { margin:0; font-size:24px; color:#f2f2f2 !important; }
    .nt-actions button, .nt-tabs button { font:inherit; font-size:13px; cursor:pointer; color:#f2f2f2 !important; background:transparent !important; border:1px solid rgba(255,255,255,.1) !important; border-radius:999px; padding:6px 12px; }
    .nt-tabs { display:flex; gap:8px; margin-bottom:14px; }
    .nt-tabs button.on { background:#c9a227 !important; border-color:#c9a227 !important; color:#111 !important; font-weight:600; }
    .nt-actions { display:flex; gap:8px; }
    .nt-row { display:flex; gap:12px; align-items:flex-start; padding:12px; margin-bottom:8px; background:#1b1b1b !important; color:#f2f2f2 !important; border:1px solid rgba(255,255,255,.1); border-radius:14px; cursor:pointer; position:relative; }
    .nt-row:hover { border-color:#c9a227; }
    .nt-row.unread { border-left:3px solid #c9a227; }
    .nt-avatar { width:40px; height:40px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
    .nt-body { flex:1; min-width:0; }
    .nt-line { font-size:14px; line-height:1.4; }
    .nt-snippet { margin-top:4px; font-size:13px; color:rgba(255,255,255,.6) !important; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .nt-time { font-size:12px; color:rgba(255,255,255,.6) !important; margin-top:4px; }
    .nt-x { background:none !important; border:0; color:rgba(255,255,255,.6) !important; font-size:18px; cursor:pointer; line-height:1; padding:2px 6px; }
    .nt-x:hover { color:#f2f2f2 !important; }
    .nt-empty, .nt-error { text-align:center; color:rgba(255,255,255,.6) !important; padding:48px 0; }
    [hidden] { display:none !important; }
</style>
</head>
<body>
<main class="nt-wrap">
    <div class="nt-top">
        <h1>Notifications</h1>
        <div class="nt-actions">
            <button type="button" id="ntMarkAll">Mark all read</button>
            <button type="button" id="ntClear">Clear all</button>
        </div>
    </div>
    <div class="nt-tabs" id="ntTabs">
        <button type="button" data-filter="all" class="on">All</button>
        <button type="button" data-filter="unread">Unread</button>
        <button type="button" data-filter="mention">Mentions</button>
    </div>
    <div id="ntList"></div>
    <p class="nt-empty" id="ntEmpty" hidden></p>
    <p class="nt-error" id="ntError" hidden></p>
</main>

<script src="api.js"></script>
<script src="profile-hover.js"></script>
<script src="planora-nav.js"></script>
<script src="notifications.js"></script>

<!-- loads last so nothing injected earlier can turn the page light -->
<style>
    html, body { background:#131313 !important; color:#f2f2f2 !important; }
    .nt-row { background:#1b1b1b !important; }
</style>
</body>
</html>
