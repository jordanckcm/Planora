<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planora</title>
    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='images/planora logo.png') }}">

    <!-- TEMP: Settings (and its theme toggle) is hidden for now, so this
         no longer reads a cached theme preference or falls back to the
         OS's light/dark setting — it just pins dark mode unconditionally.
         Revert to reading `cached.themePreference` here once Settings
         comes back. -->
    <script>
        (function () {
            document.documentElement.setAttribute("data-theme", "dark");
            try {
                var cached = JSON.parse(localStorage.getItem("planora_cached_me") || "null");
                if (cached && cached.reduceMotion) {
                    document.documentElement.setAttribute("data-reduce-motion", "");
                }
            } catch (e) { /* no cache yet — defaults apply */ }
        })();
    </script>

    <!-- FIX: base.css was never loaded on this page. It's where --panel,
         --border, --text, --text-dim, --text-faint, --gold, --green, --red
         etc. are actually DEFINED for dark mode — theme.css only overrides
         them for light mode and assumes base.css already ran first. Without
         it, every var() that settings.css/settings.js relies on was
         undefined here, which is why the Settings overlay only rendered
         correctly from profile.html (which does load base.css) and looked
         broken/washed-out when opened from the homepage. -->
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="homepage-extra.css">
    <link rel="stylesheet" href="planora-ui.css">
    <!-- FIX: this file existed on disk but was never linked anywhere, so
         none of its rules — including the scroll-to-top button's actual
         look (the chevron with no styling you saw) — ever applied. -->
    <link rel="stylesheet" href="homepage-readability-qol.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="planora-shell.css">
</head>

<body>

    <!-- TOP BAR -->
    <div class="topbar">

        <div class="profile-menu">

            <button class="profile" id="profileButton" aria-label="Profile menu" aria-haspopup="true" aria-expanded="false"></button>

            <div class="profile-dropdown" id="profileDropdown">
                <button class="profile-dropdown-item" id="viewProfileItem">View profile</button>
                <button class="profile-dropdown-item" id="discoverItem">Discover</button>
                <!-- TEMP: hidden while Settings is disabled — kept in the
                     DOM (not removed) so settings.js's existing
                     getElementById("settingsItem") calls don't error. -->
                <button class="profile-dropdown-item" id="settingsItem" style="display:none;">Settings</button>
                <div class="profile-dropdown-divider"></div>
                <button class="profile-dropdown-item danger" id="logoutItem">Log out</button>
            </div>

        </div>

        <button class="custom-button local-button">
            Local
        </button>

        <button class="custom-button global-button">
            Global
        </button>

        <button class="custom-button timeline-button">
            Timeline
        </button>

    </div>

    <!-- YEAR -->
    <div class="year-selector">

        <button id="previousYear">
            ←
        </button>

        <div class="year" id="year">
            2026
        </div>

        <button id="nextYear">
            →
        </button>

    </div>

    <div class="today-row">
        <button class="today-pill" id="todayButton">
            Today
        </button>
    </div>

    <div class="role-badge" id="roleBadge"></div>

    <div class="search-bar">
        <input type="text" id="eventSearch" class="search-input" placeholder="Search events… (press /)" autocomplete="off" maxlength="80">
        <button type="button" id="clearSearch" class="clear-search" aria-label="Clear search" style="display:none;">×</button>
    </div>


    <!-- =========================
         MONTHS
    ========================== -->

    <div class="month-wrapper">

        <div class="month-events-container" data-month="1">
            <span>JANUARY</span>
            <span class="event-count">03 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="2">
            <span>FEBRUARY</span>
            <span class="event-count">07 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="3">
            <span>MARCH</span>
            <span class="event-count">02 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="4">
            <span>APRIL</span>
            <span class="event-count">05 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="5">
            <span>MAY</span>
            <span class="event-count">00 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="6">
            <span>JUNE</span>
            <span class="event-count">01 EVENT</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="7">
            <span>JULY</span>
            <span class="event-count">04 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="8">
            <span>AUGUST</span>
            <span class="event-count">03 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="9">
            <span>SEPTEMBER</span>
            <span class="event-count">02 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="10">
            <span>OCTOBER</span>
            <span class="event-count">06 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="11">
            <span>NOVEMBER</span>
            <span class="event-count">01 EVENT</span>
        </div>

        <div class="events-container"></div>

    </div>


    <div class="month-wrapper">

        <div class="month-events-container" data-month="12">
            <span>DECEMBER</span>
            <span class="event-count">08 EVENTS</span>
        </div>

        <div class="events-container"></div>

    </div>


    <!-- =========================
         TIMELINE (roadmap-style view)
         Populated by homepage.js when the Timeline tab is active.
    ========================== -->

    <div class="timeline-container" id="timelineContainer"></div>


    <div class="toast-stack" id="toastStack"></div>

    <!-- JAVASCRIPT -->
    <script src="api.js"></script>
    <script src="settings.js"></script>
    <script src="homepage.js"></script>
    <script src="mode-effects.js"></script>
    <script src="mode-effects.js"></script>
    <script src="planora-nav.js"></script>
    <script src="feed.js"></script>

</body>

</html>
