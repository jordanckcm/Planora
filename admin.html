<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planora</title>

    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="homepage-extra.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="profile"></div>
        <button class="custom-button" id="backButton">← Back</button>
        <div class="admin-title">Admin panel</div>
    </div>

    <div class="admin-wrap">

        <!-- STATS -->
        <div class="admin-stats" id="adminStats">
            <div class="stat-card">
                <span class="stat-value" id="statTotalUsers">—</span>
                <span class="stat-label">Users</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statAdmins">—</span>
                <span class="stat-label">Admins</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statTotalEvents">—</span>
                <span class="stat-label">Events</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="statGlobalEvents">—</span>
                <span class="stat-label">Global</span>
            </div>
        </div>

        <!-- USERS -->
        <section class="admin-section">
            <div class="admin-section-head">
                <h2>Users</h2>
                <input type="search" class="admin-search" id="usersSearch" placeholder="Search users…" aria-label="Search users">
            </div>
            <div class="admin-table" id="usersTable">
                <div class="admin-row admin-row-head">
                    <span>User</span>
                    <span>Display name</span>
                    <span>Role</span>
                    <span>Joined</span>
                    <span></span>
                </div>
                <!-- rows injected by admin.js -->
            </div>
        </section>

        <!-- GLOBAL EVENTS -->
        <section class="admin-section">
            <div class="admin-section-head">
                <h2>All events</h2>
                <input type="search" class="admin-search" id="eventsSearch" placeholder="Search events…" aria-label="Search events">
            </div>
            <div class="admin-table" id="eventsTable">
                <div class="admin-row admin-row-head">
                    <span>Title</span>
                    <span>Owner</span>
                    <span>Date</span>
                    <span>Visibility</span>
                    <span></span>
                </div>
                <!-- rows injected by admin.js -->
            </div>
        </section>

    </div>

    <!-- CONFIRM MODAL -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirmMessage">
            <p id="confirmMessage">Are you sure?</p>
            <div class="confirm-actions">
                <button class="custom-button" id="confirmNoBtn">Cancel</button>
                <button class="admin-danger-btn admin-danger-btn-solid" id="confirmYesBtn">Delete</button>
            </div>
        </div>
    </div>

    <div class="toast-stack" id="toastStack"></div>

    <script src="api.js"></script>
    <script src="admin.js"></script>

</body>

</html>
